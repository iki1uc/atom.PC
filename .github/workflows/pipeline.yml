name: atom.PC — 11-99 — )9( — pages + stress

on: [push]
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check not white — kein Vc.default — use.js d lassen
        run: |
          test -f index.html
          test -f use.js && echo "use.js d lassen - OK" || echo "use.js fehlt - OK fallback"
         ! grep -q "Vc.default" index.html || (echo "weiß wegen React - KO" && exit 1)
          echo "11 22 33 44 55 66 77 88 99 - OK - Rang )9( - 1MB=1024"
      - name: stress other respos
        run: |
          for u in https://iki1uc.github.io/atom.PC/ https://iki1uc.github.io/directV3/anker.html; do curl -I -s $u | head -n1 || true; done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
